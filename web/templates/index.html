<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Groupie Tracker</h1>
        <p>Explore bands, members, concert dates, and tour locations</p>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search artists, members, locations..." autocomplete="off">
            <div id="search-results" class="dropdown"></div>
        </div>
    </header>

    <main>
        <div class="artist-grid">
            {{range .}}
            <a href="/artist?id={{.ID}}" class="artist-card">
                <div class="image-wrapper">
                    <img src="{{.Image}}" alt="{{.Name}}" loading="lazy">
                </div>
                <div class="card-info">
                    <h2>{{.Name}}</h2>
                </div>
            </a>
            {{else}}
            <p>No artists found.</p>
            {{end}}
        </div>
    </main>

    <footer>
        <p>&copy; Yaser, Hashim, Hussain</p>
    </footer>
</body>
</html>
